services:
# 1. FastAPI Backend (Uses Dockerfile in /rag)
- type: web
  name: docuhelp-api
  env: docker
  rootDir: rag
  plan: free
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: docuhelp-db
      property: connectionString
  - key: REDIS_URL
    sync: false
  - key: RABBITMQ_URL
    sync: false
  - key: COHERE_API_KEY
    sync: false
  - key: GROQ_API_KEY
    sync: false

# 2. React Frontend (Static Site)
- type: web
  name: docuhelp-frontend
  env: static
  buildCommand: npm install && npm run build
  rootDir: frontend
  staticPublishPath: dist
  headers:
  - path: /*
    name: Access-Control-Allow-Origin
    value: '*'
  routes:
  - type: rewrite
    source: /*
    destination: /index.html

# 3. Scraper Worker (Background Task)
- type: worker
  name: docuhelp-scraper
  env: docker
  rootDir: rag
  dockerCommand: python -m workers.start_worker
  plan: free
  envVars:
  - key: REDIS_URL
    sync: false
  - key: RABBITMQ_URL
    sync: false

# 4. Parser Worker (Background Task)
- type: worker
  name: docuhelp-parser
  env: docker
  rootDir: rag
  dockerCommand: python -u -m workers.parser_worker
  plan: free
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: docuhelp-db
      property: connectionString
  - key: REDIS_URL
    sync: false
  - key: RABBITMQ_URL
    sync: false
  - key: COHERE_API_KEY
    sync: false

# 5. Cron Dispatcher (Runs once a day)
- type: cron
  name: docuhelp-cron
  env: docker
  rootDir: rag
  dockerCommand: python -m workers.cron_worker
  schedule: "0 0 * * *" # Runs every day at midnight
  plan: free
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: docuhelp-db
      property: connectionString
  - key: REDIS_URL
    sync: false
  - key: RABBITMQ_URL
    sync: false

databases:
- name: docuhelp-db
  databaseName: docuhelp
  user: admin
  plan: free
